<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<script>try { const a = JSON.parse(localStorage.getItem('lifemaker2d_save') || '{}').appearance; if (a === 'light' || a === 'dark') document.documentElement.dataset.theme = a; } catch (e) { }</script>
<title>LifeMaker</title>
<meta name="description" content="スマホで遊ぶ模様替えゲーム。家具を置いて部屋を作り、住人との暮らしを楽しもう。">
<meta name="theme-color" content="#f3efe8">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<meta property="og:type" content="website">
<meta property="og:site_name" content="LifeMaker">
<meta property="og:title" content="LifeMaker">
<meta property="og:description" content="スマホで遊ぶ模様替えゲーム。家具を置いて部屋を作り、住人との暮らしを楽しもう。">
<meta property="og:url" content="https://arata-a3.github.io/LifeMaker/">
<meta property="og:image" content="https://arata-a3.github.io/LifeMaker/og-image.png">
<meta property="og:image:width" content="512">
<meta property="og:image:height" content="512">
<meta property="og:locale" content="ja_JP">
<meta name="twitter:card" content="summary">
<link rel="stylesheet" href="css/style.css?v=0.14.0">
</head>
<body>
<div id="app">
    <header>
        <h1>LifeMaker</h1>
        <div class="header-btns">
            <button id="shop-btn" class="pill-btn" aria-haspopup="dialog"><span data-icon="cart"></span>お店</button>
            <button id="preset-btn" class="pill-btn" aria-haspopup="dialog"><span data-icon="folder"></span>プリセット</button>
            <button id="menu-btn" class="icon-btn" aria-label="設定" aria-haspopup="dialog"><span data-icon="settings"></span></button>
        </div>
    </header>

    <main>
        <div id="view">
            <canvas id="scene"></canvas>
            <div id="bubble" hidden></div>
            <div id="status" aria-live="polite"><span id="coins"></span><span id="clock"></span></div>
            <div id="history">
                <button id="undo-btn" class="round-btn" aria-label="元に戻す" title="元に戻す (Ctrl+Z)" disabled>↶</button>
                <button id="redo-btn" class="round-btn" aria-label="やり直す" title="やり直す (Ctrl+Y)" disabled>↷</button>
            </div>
            <div id="hint">家具を選んで置こう。ドラッグで動かす、ダブルタップで向きを変える</div>
            <div id="toolbar" hidden>
                <span id="sel-name"></span>
                <button id="rotate-btn">⇆ 向き</button>
                <button id="color-btn"><span data-icon="palette"></span>色</button>
                <button id="fit-btn" hidden><span data-icon="fit"></span>合わせる</button>
                <button id="remove-btn">しまう</button>
                <button id="done-btn">完了</button>
            </div>
        </div>

        <section id="catalog" aria-label="家具">
            <div id="items"></div>
        </section>
    </main>

    <footer id="version"></footer>
</div>

<dialog id="menu">
    <h2>設定</h2>
    <fieldset>
        <legend>住人</legend>
        <label class="field">名前 <input id="resident-name" type="text" maxlength="12" autocomplete="off"></label>
        <label class="check"><input type="checkbox" id="resident-toggle"> 住人を出す</label>
    </fieldset>
    <fieldset>
        <legend>明るさ</legend>
        <label><input type="radio" name="appearance" value="auto"> 端末に合わせる</label>
        <label><input type="radio" name="appearance" value="light"> ライト</label>
        <label><input type="radio" name="appearance" value="dark"> ダーク</label>
    </fieldset>
    <fieldset>
        <legend>作る人向け</legend>
        <label class="check"><input type="checkbox" id="fit-mode-toggle"> 家具の合わせ方を直す「合わせる」ボタンを出す</label>
    </fieldset>
    <button id="clear-room-btn">部屋を空にする</button>
    <button id="reset-btn" class="danger">全てのデータを消す</button>
    <button id="menu-close" class="primary">閉じる</button>
</dialog>

<dialog id="tint-dialog" class="sheet">
    <h2><span id="tint-name"></span>の色合い</h2>
    <div id="tint-parts" class="tint-parts" role="group" aria-label="色を変える部分"></div>
    <div id="tint-presets" class="tint-presets" role="group" aria-label="よく使う色合い"></div>
    <div class="tint-row"><label for="tint-h">色合い</label><output id="tint-h-val"></output><input id="tint-h" type="range" min="-180" max="180" step="1" class="tint-hue"></div>
    <div class="tint-row"><label for="tint-s">鮮やかさ</label><output id="tint-s-val"></output><input id="tint-s" type="range" min="0" max="200" step="1"></div>
    <div class="tint-row"><label for="tint-l">明るさ</label><output id="tint-l-val"></output><input id="tint-l" type="range" min="50" max="150" step="1"></div>
    <div class="tint-actions">
        <button id="tint-revert">開いたときに戻す</button>
        <button id="tint-reset">元の色</button>
        <button id="tint-close" class="primary">閉じる</button>
    </div>
</dialog>

<dialog id="preset-dialog" class="sheet">
    <h2>部屋のプリセット</h2>
    <div class="preset-new">
        <input id="preset-name" type="text" maxlength="30" placeholder="名前（例: くつろぎの部屋）" autocomplete="off">
        <button id="preset-save" class="primary">今の部屋を保存</button>
    </div>
    <div id="preset-list"></div>
    <button id="preset-close" class="wide">閉じる</button>
</dialog>

<dialog id="fit-dialog" class="sheet">
    <h2><span id="fit-name"></span>の合わせ方</h2>
    <p id="fit-help" class="fit-help"></p>
    <canvas id="fit-canvas"></canvas>
    <div class="fit-row">
        <div id="fit-points" class="fit-points" role="group" aria-label="動かす点"></div>
        <button id="fit-zoom" class="tint-part" aria-pressed="false"><span data-icon="zoom"></span>拡大</button>
    </div>
    <div class="fit-nudge" role="group" aria-label="選んだ点を少し動かす">
        <button data-nudge="-1,0" aria-label="左へ">←</button>
        <button data-nudge="0,-1" aria-label="上へ">↑</button>
        <button data-nudge="0,1" aria-label="下へ">↓</button>
        <button data-nudge="1,0" aria-label="右へ">→</button>
    </div>
    <div id="fit-num-row" class="tint-row" hidden><label for="fit-num" id="fit-num-label"></label><output id="fit-num-val"></output><input id="fit-num" type="range"></div>
    <p id="fit-status" class="fit-help"></p>
    <div class="tint-actions">
        <button id="fit-revert">開いたときに戻す</button>
        <button id="fit-clear">直した値を消す</button>
        <button id="fit-export">書き出す</button>
        <button id="fit-close" class="primary">閉じる</button>
    </div>
</dialog>

<dialog id="shop-dialog" class="sheet">
    <h2>お店 <span id="shop-coins" class="shop-coins"></span></h2>
    <p class="fit-help"><span id="shop-day"></span>。夜が明けると品物が入れかわります（ゲームの中の時計は、遊んでいる間だけ進みます）</p>
    <div id="shop-list" class="shop-list"></div>
    <button id="shop-close" class="wide">閉じる</button>
</dialog>

<div id="toast" role="status"></div>

<script type="module" src="js/app.js?v=0.14.0"></script>
</body>
</html>
